[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beautyboss-ai"
version = "0.1.0"
description = "BeautyBoss AI microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "alembic",
  "pydantic-settings",
  "httpx",
  "pgvector",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]